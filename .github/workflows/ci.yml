name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22]
        include:
          - os: macos-latest
            node-version: 22
          - os: windows-latest
            node-version: 22
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck

  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec tsup src/regex-worker.ts --format cjs --target node16 --out-dir temp/runtime-smoke
      - uses: actions/setup-node@v4
        with:
          node-version: 16.14.2
      - name: Execute regex worker on the minimum VS Code runtime
        run: |
          node --check dist/index.js
          node - <<'NODE'
          const { RegexExecutor } = require('./temp/runtime-smoke/regex-worker.js')
          const executor = new RegexExecutor(500)
          executor.execute({
            ignores: [],
            maxMatches: 10,
            pattern: { source: '(?=.)', flags: 'gdu' },
            targetGroups: [0],
            text: '😀a',
          }).then((results) => {
            executor.dispose()
            if (JSON.stringify(results) !== JSON.stringify([{ spans: [[0, 0]] }, { spans: [[2, 2]] }]))
              process.exit(1)
          }).catch(() => process.exit(1))
          NODE

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run pack
      - name: Verify extension package contents
        run: |
          unzip -l vscode-highlight-text-*.vsix | grep -q 'extension/dist/index.js'
          unzip -l vscode-highlight-text-*.vsix | grep -qi 'extension/README_zh.md'
